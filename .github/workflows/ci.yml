name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node — lint, build, tipos y pruebas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bienestarpro
          POSTGRES_PASSWORD: bienestarpro_dev
          POSTGRES_DB: bienestarpro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bienestarpro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bienestarpro:bienestarpro_dev@127.0.0.1:5432/bienestarpro
      JWT_SECRET: ci-secret-no-productivo
      TOTP_ENCRYPTION_KEY: abababababababababababababababababababababababababababababababab
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: pnpm
        uses: pnpm/action-setup@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Migraciones (PostgreSQL)
        run: pnpm --filter @bienestarpro/api db:migrate
      - name: Lint
        run: pnpm -r lint
      - name: Build (contratos primero por orden topologico)
        run: pnpm -r build
      - name: Tipos
        run: pnpm -r typecheck
      - name: Pruebas
        run: pnpm -r --if-present test

  python:
    name: Python — ruff y pytest (sidecar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/ai/requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Pruebas (pytest)
        run: pytest -q
