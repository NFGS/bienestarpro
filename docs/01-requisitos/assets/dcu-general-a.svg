<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:790px;height:507px;background:#FFFFFF;" width="790px" height="507px" viewBox="0 0 790 507" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="legend" data-source-line="1"><rect x="12" y="22" width="759.376" height="466.313" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="39.995" fill="#000" font-size="14" textLength="399.301">The plugin you are using seems to generated a bad URL.</text><text x="17" y="56.292" fill="#000" font-size="14" textLength="295.887">This URL does not look like DEFLATE data.</text><text x="17" y="72.589" fill="#000" font-size="14" textLength="367.664">It looks like your plugin is using HUFFMAN encoding.</text><text x="17" y="88.886" fill="#000" font-size="14"> </text><text x="17" y="105.183" fill="#000" font-size="14" textLength="671.706">This means you have now to add an header ~1 to your data. For example, you have to change:</text><text x="17" y="121.479" fill="#000" font-size="14" textLength="558.202">http://www.plantuml.com/plantuml/png/hVVLbtswEN3zFAOvEqA2TP8dBEEUty...</text><text x="17" y="137.776" fill="#000" font-size="14" textLength="14.055">to</text><text x="17" y="154.073" fill="#000" font-size="14" textLength="578.84">http://www.plantuml.com/plantuml/png/~1hVVLbtswEN3zFAOvEqA2TP8dBEEUty...</text><text x="17" y="170.37" fill="#000" font-size="14"> </text><text x="17" y="186.667" fill="#000" font-size="14" textLength="138.277">It will work this way</text><text x="17" y="202.964" fill="#000" font-size="14" textLength="428.148">You may contact the PlantUML team at plantuml@gmail.com</text><text x="17" y="219.261" fill="#000" font-size="14" textLength="749.376">But you should also probably contact the plugin authors you are currently using and send them this image</text><text x="17" y="235.558" fill="#000" font-size="14"> </text><text x="17" y="251.854" fill="#000" font-size="14" textLength="232.545">For the record, here is your data:</text><text x="17" y="268.151" fill="#000" font-size="14"> </text><text x="17" y="284.448" fill="#000" font-size="14" textLength="709.058">hVVLbtswEN3zFAOvEqA2TP8dBEEUtym8cFHEUFbeEBKtMJFIgyKDpEWBHqLX6CpHyE16kg4lUVbYAF0Y</text><text x="17" y="300.745" fill="#000" font-size="14" textLength="690.662">HmnmzefNI3VZGqaNLXJIE9vPuOSa5X1Gcr43YBRokd0ZSIXmiRFKkvJByAPTrIADSx5YxrfmOefg3Exm</text><text x="17" y="317.042" fill="#000" font-size="14" textLength="681.864">OSdGGHz-uIr7QxrBn5-_4FZgDWhSn4E64H8iXl8knGwmH2CzxB89JYQlRmnoxaVlWqgesBJi_3JrHSot</text><text x="17" y="333.339" fill="#000" font-size="14" textLength="694.34">hKzebyPvWCmlUyHrhDt5JbCMG6kKW135sMg-iVwwHUZEbcRalkZbZ1eO9Zdtiz1oLlPxrQZ8vWlLsz03</text><text x="17" y="349.636" fill="#000" font-size="14" textLength="674.03">XL_-ZnWx6LrtFifmRf16u94S0nAFvc0EIjcFBjQk9OA7AbAlT1iJARVvO7mWIsF2oeRlHeQKxEMaho52</text><text x="17" y="365.933" fill="#000" font-size="14" textLength="689.11">8jNOg5vBYFszV8IzaJXz0qNGIWq8k8cuNCRcGq3a8HEYPtnJlZKlzZE1YDYVOGQ7dTychPHTKn4vMqur</text><text x="17" y="382.229" fill="#000" font-size="14" textLength="665.902">ETIrUwV71pKLoCn50aVlCdciuUPXAfm7V1qylL3DzKw77kGrDIXI3Lz7Cu2Tz0LcvItj9T4TXgIH0a79</text><text x="17" y="398.526" fill="#000" font-size="14" textLength="695.235">yNc8hC-6BNRnQSHRkPKg8CJELruFE8yBVIsCJWiOfC_fUkHhhu_x2HG3yn85oENsRnNMxx9dGteEbgFN</text><text x="17" y="414.823" fill="#000" font-size="14" textLength="697.279">TjoMUbQa4VElbwjw4aGu6KhZoS5cfOn0LFGQPj5UFHWKurfuWEFiD-1sNNQSRS3d8KwRntMdz9j7I4Sy</text><text x="17" y="431.12" fill="#000" font-size="14" textLength="680.121">olPHpbtEaiZVLlKGunK3ESTBWYzpNISjdlZc6_8QF0qHzru7v8PGcfMsd-Cm-3bWudvjGyzq5pN8dOdY</text><text x="17" y="447.417" fill="#000" font-size="14" textLength="688.085">KiNQKs29V2A2fJCY52QzOvUJFoTE0O9f1Ce9NadkG3l71LHHHXtCVlfennXsecdeHm3Ux9Gekai1x