<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:790px;height:523px;background:#FFFFFF;" width="790px" height="523px" viewBox="0 0 790 523" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="legend" data-source-line="1"><rect x="12" y="22" width="759.376" height="482.609" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="39.995" fill="#000" font-size="14" textLength="399.301">The plugin you are using seems to generated a bad URL.</text><text x="17" y="56.292" fill="#000" font-size="14" textLength="295.887">This URL does not look like DEFLATE data.</text><text x="17" y="72.589" fill="#000" font-size="14" textLength="367.664">It looks like your plugin is using HUFFMAN encoding.</text><text x="17" y="88.886" fill="#000" font-size="14"> </text><text x="17" y="105.183" fill="#000" font-size="14" textLength="671.706">This means you have now to add an header ~1 to your data. For example, you have to change:</text><text x="17" y="121.479" fill="#000" font-size="14" textLength="563.076">http://www.plantuml.com/plantuml/png/hVVLbtswEN3zFAOvWqA2LNF2PgiC2G...</text><text x="17" y="137.776" fill="#000" font-size="14" textLength="14.055">to</text><text x="17" y="154.073" fill="#000" font-size="14" textLength="583.714">http://www.plantuml.com/plantuml/png/~1hVVLbtswEN3zFAOvWqA2LNF2PgiC2G...</text><text x="17" y="170.37" fill="#000" font-size="14"> </text><text x="17" y="186.667" fill="#000" font-size="14" textLength="138.277">It will work this way</text><text x="17" y="202.964" fill="#000" font-size="14" textLength="428.148">You may contact the PlantUML team at plantuml@gmail.com</text><text x="17" y="219.261" fill="#000" font-size="14" textLength="749.376">But you should also probably contact the plugin authors you are currently using and send them this image</text><text x="17" y="235.558" fill="#000" font-size="14"> </text><text x="17" y="251.854" fill="#000" font-size="14" textLength="232.545">For the record, here is your data:</text><text x="17" y="268.151" fill="#000" font-size="14"> </text><text x="17" y="284.448" fill="#000" font-size="14" textLength="696.91">hVVLbtswEN3zFAOvWqA2LNF2PgiC2G5QZJEgiOusvKEpWmUjkQZFBU2LAj1EL9FFF0WPkJv0JB1SlkMz</text><text x="17" y="300.745" fill="#000" font-size="14" textLength="697.136">TrsbaeY9Ps6PZ5VlxtZlARmvu7lQwrCiuySFWFmwGozMP1jIpBHcSq1IdSfVmhlWwprxO5aLmX0oBDg3</text><text x="17" y="317.042" fill="#000" font-size="14" textLength="692.993">U3khiJUWv99O591-MoE_377DrcQzYEN9DFyXtZKccfn4W8EDVMLcSy51RQjjVhvozKuaGak7wCqYtz-n</text><text x="17" y="333.339" fill="#000" font-size="14" textLength="675.698">WptMqga2UBOJfE67j5pO2rALVVlTO9s7Lq5mrWe8NkJl8rP_P76-af_PUJ4omf89u5gRsrkYdC5TuNJW</text><text x="17" y="349.636" fill="#000" font-size="14" textLength="716.358">rrxYjcd14AsBqCvBWYV-vGNyuFDn6l4yA2ob6u5V1oXFD8WKRuA8OYyhRwv1Dq-AzIheF0xZWRQYmwko</text><text x="17" y="365.933" fill="#000" font-size="14" textLength="721.479">harYR3dggz2KsGl_oaZarWReGwc2YiXwdlw28B0pG460H3MknqNCoUjBOPo8WChrRM5aWBLD0oW6NjrH</text><text x="17" y="382.229" fill="#000" font-size="14" textLength="703.541">FkAY1h3LwjCRWECPvke8bsEp-RrmM-kDnmhd4pvgUpjcy36e2ZQu1I3IsTjuhvwlWHMOjcGD8G7_AQ92</text><text x="17" y="398.526" fill="#000" font-size="14" textLength="682.644">RY580X0qH4Czcs0ef7E9pU-HmIh6WWCem-IjBPQW0bIPY9hoJ-3YII8_Xac4bcFpDXi0K-0AzhWvXdvv</text><text x="17" y="414.823" fill="#000" font-size="14" textLength="683.061">03OAxEYgqdgEtSwHcSQ27XjdCI9j4y5Nj0K5Rngj26Qywh7tqj2EG4GT7gYHM4n_VLanzhRbeex9jh7j</text><text x="17" y="431.12" fill="#000" font-size="14" textLength="729.278">n1qWxi1Lk3BkuBsAU25m0wmK8XHv0nQ7rc8aN8amMXanH7Gd2D4U3U3BEC7USpty3-qgA3cZtxSb6XfD</text><text x="17" y="447.417" fill="#000" font-size="14" textLength="671.802">H8wfiE9rbSxbFqIlH8QMwycG2ZzjklLpQmZYI1gLg9oyydt5pHEz0p1m9IcZ7URI3JQcOcx2B1