<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:790px;height:621px;background:#FFFFFF;" width="790px" height="621px" viewBox="0 0 790 621" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="legend" data-source-line="1"><rect x="12" y="22" width="759.376" height="580.391" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="39.995" fill="#000" font-size="14" textLength="399.301">The plugin you are using seems to generated a bad URL.</text><text x="17" y="56.292" fill="#000" font-size="14" textLength="295.887">This URL does not look like DEFLATE data.</text><text x="17" y="72.589" fill="#000" font-size="14" textLength="367.664">It looks like your plugin is using HUFFMAN encoding.</text><text x="17" y="88.886" fill="#000" font-size="14"> </text><text x="17" y="105.183" fill="#000" font-size="14" textLength="671.706">This means you have now to add an header ~1 to your data. For example, you have to change:</text><text x="17" y="121.479" fill="#000" font-size="14" textLength="543.532">http://www.plantuml.com/plantuml/png/hVfNbtw2EL7rKQY-tQcHK3J_vEFgZL...</text><text x="17" y="137.776" fill="#000" font-size="14" textLength="14.055">to</text><text x="17" y="154.073" fill="#000" font-size="14" textLength="564.17">http://www.plantuml.com/plantuml/png/~1hVfNbtw2EL7rKQY-tQcHK3J_vEFgZL...</text><text x="17" y="170.37" fill="#000" font-size="14"> </text><text x="17" y="186.667" fill="#000" font-size="14" textLength="138.277">It will work this way</text><text x="17" y="202.964" fill="#000" font-size="14" textLength="428.148">You may contact the PlantUML team at plantuml@gmail.com</text><text x="17" y="219.261" fill="#000" font-size="14" textLength="749.376">But you should also probably contact the plugin authors you are currently using and send them this image</text><text x="17" y="235.558" fill="#000" font-size="14"> </text><text x="17" y="251.854" fill="#000" font-size="14" textLength="232.545">For the record, here is your data:</text><text x="17" y="268.151" fill="#000" font-size="14"> </text><text x="17" y="284.448" fill="#000" font-size="14" textLength="679.021">hVfNbtw2EL7rKQY-tQcHK3J_vEFgZL1NCh8aGN5uT74wElemQ5ECJRl2iwB9iL5GDkUeYd-kT9IhJUoU</text><text x="17" y="300.745" fill="#000" font-size="14" textLength="697.539">s3Eu9lAz38xw5puR9m3dMNO0pYQ8a88LrrhhMpH80ECjwYjivoFcGJ41Qquk_iRUxQwroWLZJ1bwXfMs</text><text x="17" y="317.042" fill="#000" font-size="14" textLength="697.252">OVg1U4XkgUHOD6yVze_8qdlIUaiSqwYy_MNN0ogGUb9s9-ezFP77-x_4Q2Aa0Ed_DVcCJZvYjdHwE13C</text><text x="17" y="333.339" fill="#000" font-size="14" textLength="680.053">dg9cwRrK49e8lbpG7xIqIXWjf04SljXawNm-bpkR-gxYDXv_cNdW6DMvhXLPdxuv2GptcqFYJo5f1Z0a</text><text x="17" y="349.636" fill="#000" font-size="14" textLength="704.334">Qjqz7ZU327RPQgpmYovNYHGt6sa0VnaK6w-7AVsZrnLxZwe4uR1CswPHMhy_sC7Y5v2QLdaBl93j3fUu</text><text x="17" y="365.933" fill="#000" font-size="14" textLength="689.5">Sfoyw9lvc9jYW6CB6XI-g78SgLbmGavRwBXzTl0rkWG6UPO6M7IB9rM0NiV36le8DTYVjduucjU8g9GS</text><text x="17" y="382.229" fill="#000" font-size="14" textLength="698.277">1x5FYhS9U2MWxrXT6MGcxubzO7XVqkYaoDFrc4GXHG69n81j-4WzP4iiNe4KRatyDQc2FBdBi-RzWJY1</text><text x="17" y="398.526" fill="#000" font-size="14" textLength="649.229">vBfZPaoqrN-DNorl7ERlluF1K6MLpCiz9z04tHe-jHGrEMe6fma8Bg5iaPtYr1UMvwgL0I2RxkIjfaPA</text><text x="17" y="414.823" fill="#000" font-size="14" textLength="692.891">FzFyHQbO0AeWWpRIwWas93paihRu-QEnlttWfluDdIbJGI7u-KN1Y5MwA6D3mc5iVOqu8KizSQG8ecyr</text><text x="17" y="431.12" fill="#000" font-size="14" textLength="678.289">lPQtNKW1ry2fFRLS28eMSi2jHlo7VpC11XC3NOZSily65UVPPMs7XrDTV4hplS5sLe1q6SqppcgZ8sru</text><text x="17" y="447.417" fill="#000" font-size="14" textLength="664.645">KciiWdynixiO3NlyY35QuJg66Srs_T0mjp1n0oL77Ie7rqZ9JPBBNwL5gXOuFT_VSuTVO_Vo51wN