<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:790px;height:474px;background:#FFFFFF;" width="790px" height="474px" viewBox="0 0 790 474" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="legend" data-source-line="1"><rect x="12" y="22" width="759.376" height="433.719" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="39.995" fill="#000" font-size="14" textLength="399.301">The plugin you are using seems to generated a bad URL.</text><text x="17" y="56.292" fill="#000" font-size="14" textLength="295.887">This URL does not look like DEFLATE data.</text><text x="17" y="72.589" fill="#000" font-size="14" textLength="367.664">It looks like your plugin is using HUFFMAN encoding.</text><text x="17" y="88.886" fill="#000" font-size="14"> </text><text x="17" y="105.183" fill="#000" font-size="14" textLength="671.706">This means you have now to add an header ~1 to your data. For example, you have to change:</text><text x="17" y="121.479" fill="#000" font-size="14" textLength="553.718">http://www.plantuml.com/plantuml/png/ZVTbTttAEH33V4zy5KgYiNRKLZUqEk...</text><text x="17" y="137.776" fill="#000" font-size="14" textLength="14.055">to</text><text x="17" y="154.073" fill="#000" font-size="14" textLength="574.355">http://www.plantuml.com/plantuml/png/~1ZVTbTttAEH33V4zy5KgYiNRKLZUqEk...</text><text x="17" y="170.37" fill="#000" font-size="14"> </text><text x="17" y="186.667" fill="#000" font-size="14" textLength="138.277">It will work this way</text><text x="17" y="202.964" fill="#000" font-size="14" textLength="428.148">You may contact the PlantUML team at plantuml@gmail.com</text><text x="17" y="219.261" fill="#000" font-size="14" textLength="749.376">But you should also probably contact the plugin authors you are currently using and send them this image</text><text x="17" y="235.558" fill="#000" font-size="14"> </text><text x="17" y="251.854" fill="#000" font-size="14" textLength="232.545">For the record, here is your data:</text><text x="17" y="268.151" fill="#000" font-size="14"> </text><text x="17" y="284.448" fill="#000" font-size="14" textLength="683.293">ZVTbTttAEH33V4zy5KgYiNRKLZUqEkJLKAFjE_ISqdqsx8kKZ8edXSNoVakf0S_sl3TWTgO0D9Gud86e</text><text x="17" y="300.745" fill="#000" font-size="14" textLength="718.765">c-ayOXZesW82FSjW60ST9WixIEYXeeMrhCF_bYxH7RtWUCA8h8Dvn79gZOQz0KRMENemIk9QMmLiDXI_</text><text x="17" y="317.042" fill="#000" font-size="14" textLength="680.9">ipT2xNCbuUaxIbewBVag0XqmHigHsyhi4Vd2JXK9EXGBPfgeAVgSvV46Hy5shsICg3fwCm7FjSxz4rsl</text><text x="17" y="333.339" fill="#000" font-size="14" textLength="674.509">PSxsfIusseovLJVlZSwmpWHnBaKpUjARuQcsxqNWS8iiHy_0cuR7o8UXxBkKlvvPxYfpRGgYF_ZScjzP</text><text x="17" y="349.636" fill="#000" font-size="14" textLength="661.924">hfWjct6UjyK8oaKp5OJ0kEwHg34rIBd2l4NFZEl41FTV9LqNz6-yzztAbgrUiiF99GuyCxuohUCoT28u</text><text x="17" y="365.933" fill="#000" font-size="14" textLength="693.868">9sDYkniDbg8mwyCL8GYrMslvT_7JY6y8WFmJS0NWFeS6NArl1TJc7aXk_Ioxv76QJLKLXFQukWzHOB69</text><text x="17" y="382.229" fill="#000" font-size="14" textLength="699.802">wGZYGPEdz2pprFt3mOx0PMmDqq6oKaB3QsxIcADztfJuWNeyTRu3bsHT_FMUzSBJPrQ1l1-7D_U8grOb</text><text x="17" y="398.526" fill="#000" font-size="14" textLength="705.824">mzQ_OM-vLqNwEALjkZwHb7FYg1oGppuQL6bo70CtA8GFxroolPLp-OlTpAWjClV71Y1pS6esqnZMbQW3</text><text x="17" y="414.823" fill="#000" font-size="14" textLength="665.752">TqTOHtlS1B3u72_d3JuQfJj5ajv-cdnISjLTlmQIl-Q9bYDKNkWAUzGMq_aVMJZsVhjmHR7hThZNgigb</text><text x="17" y="431.12" fill="#000" font-size="14" textLength="674.194">q0N7LDhjBVS8DxvNZM03FSKCkZnY1EIvpiAejrPk8PDwbT-S2YSg-p92N3FnzTLoSsyURrdc6I6AGi-P</text><text x="17" y="447.417" fill="#000" font-size="14" textLength="492.105">ROKelXVKt-pVeBvKaSmRRGppGUhJdl2Uve5a-1f-9XP5Y9nKH0b0Bw==</text></g><?plantu