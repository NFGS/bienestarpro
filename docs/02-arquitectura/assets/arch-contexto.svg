<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:790px;height:442px;background:#FFFFFF;" width="790px" height="442px" viewBox="0 0 790 442" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="legend" data-source-line="1"><rect x="12" y="22" width="759.376" height="401.125" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="39.995" fill="#000" font-size="14" textLength="399.301">The plugin you are using seems to generated a bad URL.</text><text x="17" y="56.292" fill="#000" font-size="14" textLength="295.887">This URL does not look like DEFLATE data.</text><text x="17" y="72.589" fill="#000" font-size="14" textLength="367.664">It looks like your plugin is using HUFFMAN encoding.</text><text x="17" y="88.886" fill="#000" font-size="14"> </text><text x="17" y="105.183" fill="#000" font-size="14" textLength="671.706">This means you have now to add an header ~1 to your data. For example, you have to change:</text><text x="17" y="121.479" fill="#000" font-size="14" textLength="564.163">http://www.plantuml.com/plantuml/png/bVPNbhMxEL77KUY5pVJTTlw4VHVDA5...</text><text x="17" y="137.776" fill="#000" font-size="14" textLength="14.055">to</text><text x="17" y="154.073" fill="#000" font-size="14" textLength="584.801">http://www.plantuml.com/plantuml/png/~1bVPNbhMxEL77KUY5pVJTTlw4VHVDA5...</text><text x="17" y="170.37" fill="#000" font-size="14"> </text><text x="17" y="186.667" fill="#000" font-size="14" textLength="138.277">It will work this way</text><text x="17" y="202.964" fill="#000" font-size="14" textLength="428.148">You may contact the PlantUML team at plantuml@gmail.com</text><text x="17" y="219.261" fill="#000" font-size="14" textLength="749.376">But you should also probably contact the plugin authors you are currently using and send them this image</text><text x="17" y="235.558" fill="#000" font-size="14"> </text><text x="17" y="251.854" fill="#000" font-size="14" textLength="232.545">For the record, here is your data:</text><text x="17" y="268.151" fill="#000" font-size="14"> </text><text x="17" y="284.448" fill="#000" font-size="14" textLength="673.777">bVPNbhMxEL77KUY5pVJTTlw4VHVDA5FIs8oCFVIu7u5sYrqxl_G4tCAkHoLX4NRHyJvwJIx3u5tScftm</text><text x="17" y="300.745" fill="#000" font-size="14" textLength="692.405">5vP8fDM-C2yI464GQ8V2UnjHeMde1VgxsAeymy1DaQkLtt6pcGNdY8jsoDHFjdlgzvc1Qgobt6lRsWWx</text><text x="17" y="317.042" fill="#000" font-size="14" textLength="679.704">NX2JlsUZyUCJ0OeFPz9_wblFh6luRh7Gja09-yOlTMGeYKQbQlfabyMwAXS26v1zF5hiwm1kfpn3kan3</text><text x="17" y="333.339" fill="#000" font-size="14" textLength="728.67">VFpnCrt_cGs3pG950_MhcbyztTX0nKEHxtRUyEj736Z7qmd9JPPUBdZuPDMB4eVRS8mWK6WG4WH0dDSh</text><text x="17" y="349.636" fill="#000" font-size="14" textLength="674.83">NrVhU3naJRFqeBy1fZl_yuG7AogBi5RwtMJKxEayPhyD82wrW8hIXvIdg-CtCWt3DwHp1oo7JFmv-3Jt</text><text x="17" y="365.933" fill="#000" font-size="14" textLength="691.031">-gIdk-9aX64u1I9_WpOObhFLT9g-3aEL5vNh2EX-pu2nqH0sk6ZE2OVa6Pm7Q-BqazjoppHpFsgGpq1b</text><text x="17" y="382.229" fill="#000" font-size="14" textLength="664.275">Z_NurCt9oGYxbOErXgv1oxBeP0r2IX_7rLXcBsZdEuXiUsO4ikj_ESzFnnSY-0p6h6yOAV7AeySysiob</text><text x="17" y="398.526" fill="#000" font-size="14" textLength="715.641">d1Iu-NrL0ZqN2z8EtkWfYjmb61Rbzgomk9O0BCWHNODp-QD1AcodDFgWPmCVdpiMVqHeEAV62I6ajJOT</text><text x="17" y="414.823" fill="#000" font-size="14" textLength="269.09">0644vIIqyqeQu3cehtM_k4uXP6j-Ag==</text></g><?plantuml-src ZLJRigeu47tdA_811xSWekwgKpKg8BZbuWL4Nwm04P10a0GH7ywt3-hiEJKlC_D2XNJtMgjxTGMZ61KHjqiGA74TfmLeIGrWXK1Dqo865A6S0aP0buOgo50480XW1DpDgjULfVHv0X5151I40Kn81d2Q8Q2escgwKq446UnnnZj4tx6Ee_hcwn3ULBghQURK0gW8ITHTzBWtVevWGL-o4dX37Klpr0EZJaa14WGZL85VmlFk1VlY0ngf0Bh3lCJen-_QBYTCO16ZJovXhFpy-6YQfbTYMB0wnxsGv1_VFnzb4Ny4dcC5YNbNLwFHbtiObjvojyEDvEcUCXtsU